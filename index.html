<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Void Manifest</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #060810;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 0;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    canvas { display: block; }

    /* ── Inspection Panel ── */
    #inspection-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 840px;
      max-height: 680px;
      background: #0b1219;
      border: 1px solid #2a4060;
      box-shadow: 0 0 40px rgba(0,80,160,0.3), inset 0 0 60px rgba(0,0,0,0.5);
      color: #8aabcc;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    #inspection-panel.visible { display: flex; }

    .panel-header {
      background: #0f1e2e;
      border-bottom: 1px solid #1e3650;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .panel-title {
      color: #4488bb;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #pod-id-label {
      color: #ccddee;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* ── Two-column body ── */
    .panel-body {
      display: flex;
      flex-direction: row;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* LEFT: manifest + scan readouts */
    .panel-col-left {
      width: 372px;
      flex-shrink: 0;
      padding: 14px 16px 14px 18px;
      border-right: 1px solid #1e3650;
      overflow-y: auto;
    }

    .section-title {
      font-size: 10px;
      letter-spacing: 3px;
      color: #446688;
      text-transform: uppercase;
      border-bottom: 1px solid #1a2e40;
      padding-bottom: 5px;
      margin-bottom: 8px;
      margin-top: 2px;
    }

    .properties-section { margin-bottom: 16px; }

    .property-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #0e1a24;
    }

    .prop-key {
      color: #556677;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .prop-value {
      color: #ccddee;
      font-size: 13px;
      font-weight: bold;
    }

    /* ── Scan section ── */
    .scan-section { margin-bottom: 6px; }

    #xray-canvas {
      display: block;
      width: 338px;
      height: 190px;
      border: 1px solid #1a4a22;
      margin: 8px 0 0;
      image-rendering: pixelated;
    }

    .xray-signature {
      font-size: 10px;
      color: #228855;
      font-style: italic;
      letter-spacing: 0.5px;
      padding: 5px 0 8px;
      line-height: 1.4;
    }

    #weight-scan-row {
      margin-top: 8px;
      padding-top: 8px !important;
      border-top: 1px solid #0e1a24 !important;
    }

    /* ── RIGHT: handbook ── */
    .panel-col-right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .handbook-header {
      font-size: 10px;
      letter-spacing: 3px;
      color: #335566;
      text-transform: uppercase;
      padding: 10px 16px 8px;
      border-bottom: 1px solid #1a2e40;
      flex-shrink: 0;
    }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid #1a2e40;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      background: transparent;
      border: none;
      border-right: 1px solid #1a2e40;
      color: #445566;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn:last-child { border-right: none; }

    .tab-btn.active {
      color: #4488bb;
      background: #0d1a26;
    }

    .tab-btn:hover:not(.active) {
      background: #0a1520;
      color: #6699aa;
    }

    .tab-panels {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .tab-panel {
      display: none;
      padding: 12px 16px;
    }

    .tab-panel.active { display: block; }

    /* Weight tab */
    .weight-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
    }

    .weight-table th {
      font-size: 9px;
      letter-spacing: 2px;
      color: #446688;
      text-transform: uppercase;
      border-bottom: 1px solid #1a2e40;
      padding: 4px 6px;
      text-align: left;
    }

    .weight-table td {
      font-size: 11px;
      color: #8aabcc;
      padding: 7px 6px;
      border-bottom: 1px solid #0e1a24;
      vertical-align: top;
      line-height: 1.4;
    }

    .weight-class-chip {
      display: inline-block;
      color: #ccddee;
      font-weight: bold;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .hb-note {
      margin-top: 10px;
      font-size: 9px;
      color: #334455;
      letter-spacing: 0.5px;
      line-height: 1.6;
      border-top: 1px solid #0e1a24;
      padding-top: 8px;
    }

    /* Planets tab */
    .hb-planet-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #0e1a24;
    }

    .hb-flag-slot canvas {
      display: block;
      border-radius: 1px;
    }

    .hb-planet-info { flex: 1; }

    .hb-planet-id {
      color: #ccddee;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .hb-planet-name {
      color: #557799;
      font-size: 10px;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .hb-planet-note {
      color: #334455;
      font-size: 9px;
      letter-spacing: 0.3px;
      margin-top: 3px;
      font-style: italic;
    }

    /* Contents tab */
    .content-entry {
      padding: 8px 0;
      border-bottom: 1px solid #0e1a24;
    }

    .content-type-label {
      color: #ccddee;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .content-desc {
      color: #557799;
      font-size: 10px;
      letter-spacing: 0.3px;
      line-height: 1.5;
    }

    .content-routing {
      color: #445533;
      font-size: 9px;
      letter-spacing: 0.3px;
      margin-top: 3px;
      font-style: italic;
    }

    /* ── Footer ── */
    .panel-footer {
      border-top: 1px solid #1e3650;
      padding: 12px 18px;
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    .btn {
      flex: 1;
      padding: 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid;
      background: transparent;
      transition: background 0.15s, color 0.15s;
    }

    #btn-approve {
      color: #44cc88;
      border-color: #2a6644;
    }
    #btn-approve:hover { background: #1a3322; }

    #btn-deny {
      color: #cc4444;
      border-color: #662222;
    }
    #btn-deny:hover { background: #331111; }

    /* ── Notification toast ── */
    #toast {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f1e2e;
      border: 1px solid #2a4060;
      color: #8aabcc;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      padding: 9px 22px;
      letter-spacing: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 200;
      white-space: nowrap;
    }

    #toast.show { opacity: 1; }
    #toast.positive { color: #44cc88; border-color: #2a6644; }
    #toast.negative { color: #cc4444; border-color: #662222; }
    #toast.neutral  { color: #8aabcc; border-color: #2a4060; }
  </style>
</head>
<body>
  <div id="game-wrapper">

    <div id="inspection-panel">
      <div class="panel-header">
        <span class="panel-title">// Cargo Inspection Terminal</span>
        <span id="pod-id-label">POD-000</span>
      </div>

      <div class="panel-body">

        <!-- LEFT: declared manifest + scan readouts -->
        <div class="panel-col-left">

          <div class="section-title">Declared Manifest</div>
          <div class="properties-section">
            <div class="property-row">
              <span class="prop-key">WEIGHT</span>
              <span class="prop-value" id="prop-weight">—</span>
            </div>
            <div class="property-row">
              <span class="prop-key">CONTENT TYPE</span>
              <span class="prop-value" id="prop-content">—</span>
            </div>
            <div class="property-row">
              <span class="prop-key">DESTINATION</span>
              <span class="prop-value" id="prop-dest">—</span>
            </div>
            <div class="property-row">
              <span class="prop-key">DECLARED FLAG</span>
              <span class="prop-value" id="prop-flag">—</span>
            </div>
          </div>
          <div style="margin-top: 12px; margin-bottom: 8px;">
            <canvas id="declared-flag-canvas" width="96" height="56" style="border: 1px solid #1a2e40; display: block;"></canvas>
          </div>

          <div class="section-title">Scan Readouts</div>
          <div class="scan-section">
            <canvas id="xray-canvas" width="338" height="190"></canvas>
            <div class="xray-signature" id="prop-scan-output">AWAITING SCAN…</div>
            <div class="property-row" id="weight-scan-row" style="display:none">
              <span class="prop-key">MEASURED WEIGHT</span>
              <span class="prop-value" id="prop-weight-scan">—</span>
            </div>
          </div>

        </div><!-- /.panel-col-left -->

        <!-- RIGHT: inspection handbook -->
        <div class="panel-col-right">
          <div class="handbook-header">Inspection Handbook</div>
          <div class="tab-bar">
            <button class="tab-btn active" data-tab="weight">WEIGHT</button>
            <button class="tab-btn" data-tab="planets">PLANETS</button>
            <button class="tab-btn" data-tab="contents">CONTENTS</button>
          </div>
          <div class="tab-panels">
            <div class="tab-panel active" id="tab-weight"><!-- populated by JS --></div>
            <div class="tab-panel"        id="tab-planets"><!-- populated by JS --></div>
            <div class="tab-panel"        id="tab-contents"><!-- populated by JS --></div>
          </div>
        </div><!-- /.panel-col-right -->

      </div><!-- /.panel-body -->

      <div class="panel-footer">
        <button id="btn-approve" class="btn">Approve Parcel</button>
        <button id="btn-deny" class="btn">Deny Parcel</button>
      </div>
    </div><!-- /#inspection-panel -->

    <div id="toast"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
